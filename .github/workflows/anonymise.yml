name: Anonymise repo

# Copies one GitHub repo into a NEW PRIVATE repo with its whole history anonymised (anon/). The job description is
# encrypted (JOB_KEY secret), every name in it is masked in the logs, and the saved state is encrypted too, so
# this public repo shows nothing about which project went where.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Encrypted job (made with the local helper)
        required: true
      mode:
        description: all = anonymise, push and import issues (resumes a paused history fetch); issues = continue an unfinished issue import
        type: choice
        options: [all, issues]
        default: all
      from_run:
        description: (set by the workflow) run whose saved state the issue import continues from
        required: false
        default: ''
      attempt:
        description: (set by the workflow) retry number after a problem
        required: false
        default: '1'

run-name: Anonymise (${{ inputs.mode }}, attempt ${{ inputs.attempt }})

permissions:
  contents: read
  actions: read

jobs:
  anonymise:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: inputs.mode == 'all'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install --quiet git-filter-repo==2.47.0
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Restore state
        if: inputs.from_run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_KEY: ${{ secrets.JOB_KEY }}
        run: |
          gh run download "${{ inputs.from_run }}" -n state -D enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:JOB_KEY -in enc/state.enc | tar -xz

      # A problem does not fail the run (no failure emails): it retries itself instead.
      - name: Anonymise
        id: anon
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          READ_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.APP_ID }}  # optional GitHub App: its own read quota
          APP_KEY: ${{ secrets.APP_KEY }}
          PSEUDONYM_KEY: ${{ secrets.PSEUDONYM_KEY }}
          JOB_KEY: ${{ secrets.JOB_KEY }}
          JOB: ${{ inputs.job }}
          NAMES_REPO: ${{ secrets.NAMES_REPO }}
          MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          PYTHONUTF8: '1'
        run: python -I anon/action.py

      - name: Encrypt state
        if: always()
        env:
          JOB_KEY: ${{ secrets.JOB_KEY }}
        run: |
          mkdir -p enc-out
          if [ -d state ]; then tar -cz state | openssl enc -aes-256-cbc -pbkdf2 -pass env:JOB_KEY -out enc-out/state.enc; fi

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: enc-out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Continue in a new run
        if: steps.anon.outcome == 'success' && steps.anon.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JOB: ${{ inputs.job }}
        run: gh workflow run anonymise.yml -R "${{ github.repository }}" -f job="$JOB" -f mode="${{ steps.anon.outputs.next }}" -f from_run="${{ github.run_id }}"

      - name: Retry after a problem
        if: steps.anon.outcome == 'failure' && inputs.attempt != '3'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JOB: ${{ inputs.job }}
        run: |
          # History already pushed: only the issue import is retried. Either way the saved state (fetched history,
          # import progress) carries over.
          if [ -f state/pushed ]; then mode=issues; else mode=all; fi; from=${{ github.run_id }}
          sleep 120
          gh workflow run anonymise.yml -R "${{ github.repository }}" -f job="$JOB" -f mode=$mode -f from_run="$from" -f attempt=$(( ${{ inputs.attempt }} + 1 ))
          echo "Problem in attempt ${{ inputs.attempt }}; retrying ($mode)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a problem that retries did not fix
        if: steps.anon.outcome == 'failure' && inputs.attempt == '3'
        run: echo "NOT FINISHED after 3 attempts - see the Anonymise step log" | tee -a "$GITHUB_STEP_SUMMARY"
